name: build-frontend-image

# Builda a imagem do front (Next standalone) e publica no Docker Hub.
# Requer os secrets no repositório: DOCKERHUB_USERNAME e DOCKERHUB_TOKEN.
# Ajuste IMAGE_NAME / a tag de versão conforme necessário.

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      extra_tag:
        description: "Tag extra (ex.: 4.0.4.4-nfc2). Vazio = usa a padrão do env."
        required: false
        default: ""

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    env:
      # Repositório no Docker Hub. Por padrão usa <seu-usuario>/zpro-frontend.
      IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/zpro-frontend
      # Tag "de versão" — atrele ao upstream + sufixo do seu fork.
      VERSION_TAG: 4.0.4.4-nfc
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          # IMPORTANTE: contexto = pasta que contém o Dockerfile do front.
          # Se o repo é a PRÓPRIA pasta frontend, use ".". Se o front está em
          # subpasta (ex.: repo com zpro.io/frontend), troque para "./frontend".
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.VERSION_TAG }}
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          # Não passamos NEXT_PUBLIC_API_URL no build: o placeholder __ZPRO_API_URL__
          # é resolvido em runtime pelo docker-entrypoint.sh via $API_URL (multi-tenant).
          cache-from: type=gha
          cache-to: type=gha,mode=max
